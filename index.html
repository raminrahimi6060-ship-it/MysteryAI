
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Mystery AI</title>
</head>
<body>

<header>
<h1>👻 MYSTERY AI</h1>
<p>کارگاه هوشمند ساخت داستان ترسناک</p>
</header>

<main>
<h2>ساخت داستان ترسناک</h2>

<textarea id="storyPrompt" placeholder="موضوع داستان را بنویس..."></textarea>

<button id="createStory">✨ ساخت داستان</button>

<button onclick="saveStory()">💾 ذخیره داستان</button>

<button onclick="showStories()">📚 داستان‌های ذخیره‌شده</button>

<div id="result">داستان شما اینجا نمایش داده می‌شود.</div>
</main>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
 navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
